define host {
    use                     linux-server
    host_name               aiwebserver-file-integrity
    alias                   Aiwebserver file-integrity exporter
    address                 172.17.0.1
}

define service {
    use                     local-service
    host_name               aiwebserver-file-integrity
    service_description     Workspace File Integrity
    check_command           check_http!-p 9110 -u /nagios -e 200
}