services:
  cacti:
    build:
      context: .
      dockerfile: Dockerfile.cacti
    restart: unless-stopped
    environment:
      CACTI_DB_HOST: 127.0.0.1
      CACTI_DB_NAME: cacti
      CACTI_DB_USER: cactiuser
      CACTI_DB_PASSWORD: ${CACTI_DB_PASSWORD:?Set CACTI_DB_PASSWORD in .env.cacti}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-allowed-packet=500M", "--innodb-file-per-table=1", "--innodb-doublewrite=OFF", "--innodb-use-atomic-writes=ON", "--sql-mode=NO_ENGINE_SUBSTITUTION"]
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - cacti_web:/var/www/html
      - cacti_database_local:/var/lib/mysql

volumes:
  cacti_database_local:
  cacti_web: