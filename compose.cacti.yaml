services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${CACTI_DB_ROOT_PASSWORD:?Set CACTI_DB_ROOT_PASSWORD in .env.cacti}
      MARIADB_DATABASE: cacti
      MARIADB_USER: cactiuser
      MARIADB_PASSWORD: ${CACTI_DB_PASSWORD:?Set CACTI_DB_PASSWORD in .env.cacti}
      MARIADB_INITDB_SKIP_TZINFO: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=500M
      - --innodb-file-per-table=1
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - cacti_database:/var/lib/mysql
      - ./downloads/cacti-1.2.31/cacti.sql:/docker-entrypoint-initdb.d/20-cacti.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  cacti:
    build:
      context: .
      dockerfile: Dockerfile.cacti
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CACTI_DB_HOST: db
      CACTI_DB_NAME: cacti
      CACTI_DB_USER: cactiuser
      CACTI_DB_PASSWORD: ${CACTI_DB_PASSWORD:?Set CACTI_DB_PASSWORD in .env.cacti}
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - cacti_web:/var/www/html

volumes:
  cacti_database:
  cacti_web: